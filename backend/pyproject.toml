[tool.ruff]
target-version = "py312"
line-length = 120
exclude = ["migrations", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# Seeded business copy — long prose strings, not something to wrap for a linter.
"content/management/commands/seed_content.py" = ["E501"]
