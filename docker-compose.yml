services:
  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=himanshu
      - POSTGRES_USER=himanshu
      - POSTGRES_PASSWORD=himanshu
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5434:5432" # non-default host port to avoid clashing with other local Postgres instances

  # Builds an immutable image (no volume mount) and serves via gunicorn.
  backend:
    build: ./backend
    image: himanshu-photography-backend:prod
    ports:
      - "8001:8000"
    environment:
      - DJANGO_DEBUG=False
      - DJANGO_SECRET_KEY=change-me-in-real-production
      - DJANGO_ALLOWED_HOSTS=*
      - POSTGRES_DB=himanshu
      - POSTGRES_USER=himanshu
      - POSTGRES_PASSWORD=himanshu
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - CORS_ALLOWED_ORIGINS=http://localhost:8080
      - CALLMEBOT_API_KEY=change-me-in-local-env
      - WHATSAPP_ALERT_PHONE=+91XXXXXXXXXX
    depends_on:
      - db

  # Uses the Dockerfile's multi-stage build: `npm run build` -> served via Nginx.
  frontend:
    build: ./frontend
    image: himanshu-photography:prod
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  pgdata:
